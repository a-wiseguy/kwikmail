[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kwikmail"
version = "1.1.0"
description = "A keyboard-first IMAP mail client for your terminal"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
  "textual>=6.0,<7",
  "imapclient>=3.0,<4",
  "rapidfuzz>=3.14,<4",
  "markdownify>=1.2,<2",
  "markdown-it-py>=4,<5",
  "msal>=1.31,<2",
  "google-auth-oauthlib>=1.2,<2",
  "filelock>=3.16,<4",
  "typer>=0.27.3,<0.28",
]

[project.urls]
Homepage = "https://github.com/a-wiseguy/kwikmail"
Issues = "https://github.com/a-wiseguy/kwikmail/issues"

[project.scripts]
kwikmail = "kwikmail.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.14", "aiosmtpd>=1.4", "trustme>=1.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
