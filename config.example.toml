[account]
host = "mail.example.com"
username = "you@example.com"
address = "you@example.com"
name = "Your name"
imap_port = 993
imap_security = "tls"
smtp_port = 587
smtp_security = "starttls"
# smtp_host = "mail.example.com"  # Defaults to host
# smtp_username = "you@example.com"  # Defaults to username
password_env = "KWIKMAIL_PASSWORD"
# Or use a password manager. Commands are executed directly, without a shell.
# password_command = ["pass", "show", "mail/example"]
# password_command = ["security", "find-generic-password", "-s", "kwikmail", "-w"]
# smtp_password_env = "KWIKMAIL_SMTP_PASSWORD"  # Only for a separate SMTP password
sent_folder = "Sent"  # Set to "" if your server already saves sent mail
inbox = "INBOX"
page_size = 100
timeout = 15
# ca_file = "/path/to/private-ca.pem"  # For a private CA; TLS verification stays on
